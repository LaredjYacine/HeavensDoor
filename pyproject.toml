[project]
name = "heavensdoor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LaredjYacine", email = "laredjyacine955@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bm25s[full]>=0.3.11",
    "celery>=5.6.3",
    "certifi>=2026.7.22",
    "deepeval==4.2.6",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "gradio-client>=2.7.0",
    "groq>=0.37.1",
    "huggingface-hub>=1.3.0,<1.18.0",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.15.6",
    "langgraph>=1.2.11",
    "openai>=3.3.0",
    "pandas>=3.0.5",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.5",
    "python-certifi-win32>=1.6.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "slowapi>=0.1.10",
    "supabase>=2.31.0",
    "tenacity>=9.1.4",
    "truststore>=0.10.4",
    "upstash-redis>=1.8.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
heavensdoor = "heavensdoor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16.8",
    "pylint>=4.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py", "*_test.py", "RagEval.py"]
markers = [
    "rag_eval: live RAG evaluation, needs network plus real credentials (RAG_EVAL=1)",
]
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
