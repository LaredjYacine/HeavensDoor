[project]
name = "heavensdoor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LaredjYacine", email = "laredjyacine955@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bm25s[full]>=0.3.11",
    "celery>=5.6.3",
    "certifi>=2026.7.22",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "gradio-client>=2.7.0",
    "huggingface-hub>=1.31.0",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "python-certifi-win32>=1.6.1",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "supabase>=2.31.0",
    "tenacity>=9.1.4",
    "truststore>=0.10.4",
    "upstash-redis>=1.8.0",
]

[project.scripts]
heavensdoor = "heavensdoor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16.8",
    "pylint>=4.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
