name: FastAPI Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Endpoint tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run endpoint tests
        run: uv run pytest -v
