name: embed-jobs
on:
#  schedule:
#    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # 1. copy your repo onto the VM

      - uses: astral-sh/setup-uv@v6          # 2. install uv on the VM
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev --all-extras   # 3. install your pyproject deps

      - name: Run embedding job
        run: uv run python scripts/Embeddings.py   # 4. run the job
        env:                                        # 5. inject credentials
          supabase_url: ${{ secrets.SUPABASE_URL }}
          supabase_Key: ${{ secrets.SUPABASE_KEY }}
